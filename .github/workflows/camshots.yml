name: camshots

on:
  schedule:
    # 日本時間 7時・11時・15時に間に合うよう、各10分前に撮る（6:50 / 10:50 / 14:50 JST = UTC 21:50 / 1:50 / 5:50）
    - cron: "50 21,1,5 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/camshots.mjs
      - yukiyomi.html
      - .github/workflows/camshots.yml

permissions:
  contents: write

concurrency:
  group: camshots
  cancel-in-progress: true

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: node scripts/camshots.mjs
      - name: Publish to camshots branch (orphan, force push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -b camshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "camshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" camshots
