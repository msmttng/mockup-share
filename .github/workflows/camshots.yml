name: camshots

on:
  schedule:
    # GitHub の定時実行は数時間遅れたり抜けたりする。そこで日本時間 4:10〜17:40 の30分おきに起動し、
    # 撮影時刻（7:00・11:00・15:00）の3時間前以内なら準備してその時刻まで待ってから撮る。
    # 撮影時刻を過ぎて3時間以内に起動した場合で、まだ撮っていなければすぐ撮る。同時に動くのは1つだけ。
    - cron: "10,40 19-23,0-8 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/camshots.mjs
      - yukiyomi.html
      - .github/workflows/camshots.yml

permissions:
  contents: write

concurrency:
  group: camshots
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Decide slot (7時・11時・15時のどの枠を撮るか)
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          D=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          H=$(TZ=Asia/Tokyo date +%-H); M=$(TZ=Asia/Tokyo date +%-M)
          NOW=$((H*60+M))
          # 最後に撮った枠（キャッシュのない API で読む）
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/contents/index.json?ref=camshots" -H "Accept: application/vnd.github.raw" 2>/dev/null | jq -r '.slot // empty' || true)
          echo "JST $H:$M event=$EVENT last=$LAST"
          RUN=0; SLOT=""; WAIT=0
          # 1) 撮影時刻を過ぎて3時間以内で、まだ撮っていない枠 → すぐ撮る
          for T in 7 11 15; do S=$(printf '%s-%02d' "$D" "$T"); TM=$((T*60))
            if [ $NOW -ge $TM ] && [ $((NOW-TM)) -lt 180 ]; then
              if [ "$EVENT" != "schedule" ] || [ "$LAST" != "$S" ]; then RUN=1; SLOT=$S; WAIT=0; fi
            fi
          done
          # 2) 次の撮影時刻まで3時間以内で、まだ撮っていない枠 → その時刻まで待って撮る（定時起動のときだけ）
          if [ $RUN = 0 ] && [ "$EVENT" = "schedule" ]; then
            for T in 7 11 15; do S=$(printf '%s-%02d' "$D" "$T"); TM=$((T*60))
              if [ $NOW -lt $TM ] && [ $((TM-NOW)) -le 180 ] && [ "$LAST" != "$S" ]; then RUN=1; SLOT=$S; WAIT=$(TZ=Asia/Tokyo date -d "$D $T:00:00" +%s); break; fi
            done
          fi
          # 手動・push のときは時刻に関係なくすぐ撮る
          if [ "$EVENT" != "schedule" ]; then RUN=1; WAIT=0; fi
          echo "run=$RUN slot=$SLOT target_epoch=$WAIT"
          { echo "run=$RUN"; echo "slot=$SLOT"; echo "wait=$WAIT"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == '1'
      - uses: actions/setup-node@v4
        if: steps.slot.outputs.run == '1'
        with:
          node-version: 20
      - name: Install playwright
        if: steps.slot.outputs.run == '1'
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Wait until the shooting time
        if: steps.slot.outputs.run == '1' && steps.slot.outputs.wait != '0'
        run: |
          W=$(( ${{ steps.slot.outputs.wait }} - $(date +%s) ))   # 撮影時刻（7:00/11:00/15:00）までの秒数
          if [ $W -gt 0 ]; then echo "sleep ${W}s until $(TZ=Asia/Tokyo date -d "@${{ steps.slot.outputs.wait }}" +%H:%M:%S) JST"; sleep $W; fi
      - name: Take screenshots
        if: steps.slot.outputs.run == '1'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: node scripts/camshots.mjs
      - name: Shrink images (width 640px)
        if: steps.slot.outputs.run == '1'
        run: |
          command -v mogrify >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mogrify -resize '640x>' -strip -quality 72 out/*.jpg
          du -sh out
      - name: Publish to camshots branch (orphan, force push)
        if: steps.slot.outputs.run == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -b camshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "camshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" camshots
